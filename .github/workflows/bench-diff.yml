name: bench-diff
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run-benchdiff:
    runs-on: ubuntu-latest
    # Branches (push) or forked PRs. Same-repo PRs already run on push for the same sha.
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.fork == true
    permissions:
      checks: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    # Version: https://github.com/WillAbides/benchdiff-action/releases/tag/v0.3.5
    - uses: WillAbides/benchdiff-action@990b4c50b5420b485bf87e42c9f18234eba76fbc
      id: benchdiff
      with:
        benchdiff_version: 0.9.1
        # Only post the check-run on push: pull_request tokens are read-only for forks and dependabot.
        report_status: ${{ github.event_name == 'push' }}
        status_name: benchdiff-result
        status_on_degraded: neutral
        # See https://github.com/WillAbides/benchdiff
        benchdiff_args: |
          --base-ref=origin/main
          --cpu=1,2
          --count=5
          --warmup-count=1
          --warmup-time=10ms
          --benchtime=100ms
          --tolerance=20
          --benchmem
          --debug
    - name: Publish benchstat output to the job summary
      if: always() && steps.benchdiff.outputs.benchstat_output != ''
      env:
        BENCHSTAT_OUTPUT: ${{ steps.benchdiff.outputs.benchstat_output }}
      run: |
        {
          echo "## Benchdiff results"
          echo
          printf '%s\n' "$BENCHSTAT_OUTPUT"
        } >> "$GITHUB_STEP_SUMMARY"
